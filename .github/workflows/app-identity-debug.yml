name: app-identity-debug
on:
  push:
    branches: [fix/app-identity-ci]

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the menu-bar name before anything writes it
        run: |
          python - <<'PY'
          import sys
          print("executable:", sys.executable)
          print("real:", __import__("os").path.realpath(sys.executable))
          print("prefix:", sys.prefix)
          from ui import app_identity
          print("menu_bar_name before:", app_identity.menu_bar_name())
          print("info dict writable:", app_identity._info_dictionary() is not None)
          print("name_in_menu_bar:", app_identity.name_in_menu_bar("Imprint"))
          print("menu_bar_name after:", app_identity.menu_bar_name())
          PY
