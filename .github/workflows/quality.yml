name: quality
on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt coverage
      - name: Tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m coverage run --source=agents,services,providers,ui,cloud,vidforge,main -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Lint ratchet
        run: python docs/company/tooling/ratchet.py ruff ruff check --no-cache --quiet --output-format=concise --exit-zero .
