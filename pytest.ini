[pytest]
testpaths = tests

# ── Why there is a timeout at all ────────────────────────────────────────────
# A Qt suite does not fail when it deadlocks, it stops. On 2026-10-05 a full
# run sat for 25 minutes on four seconds of CPU: the main thread was blocked in
# QObject::disconnect under ui/widgets.polish_combo's QComboBox.setStyle(),
# contending with FFmpeg audio threads that tests/test_audiobook_player.py had
# left running. Under `-q` a wedged run prints nothing at all, so it reads as a
# slow run and the only way to learn otherwise is to sample the process.
#
# 300s is far above the slowest test here (building GodAI costs a few seconds;
# the whole suite is ~90s), so this never fires on work that is merely slow.
timeout = 300

# `thread`, not the default `signal`. SIGALRM is only delivered once the
# interpreter regains control, which never happens while the main thread is
# inside a C++ mutex wait — exactly the case this guards. The thread method
# dumps every thread's stack and exits, so a wedge leaves the diagnosis behind
# instead of needing `sample` on a live pid.
timeout_method = thread
